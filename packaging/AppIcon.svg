<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    StandUpTimer App Icon · 「箭头小人」· 糖果风格
    修改后运行 `make icon` 重新生成 packaging/AppIcon.icns
  -->
  <defs>
    <!-- 底板:浅粉色,上浅下深,营造一点立体感 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8E3EA"/>
      <stop offset="1" stop-color="#EDC7D6"/>
    </linearGradient>
    <!-- 图形渐变:左下蓝 → 中间粉 → 右上橙(椅子偏冷色 = 坐着,小人偏暖色 = 站起来) -->
    <linearGradient id="st" gradientUnits="userSpaceOnUse" x1="280" y1="740" x2="760" y2="290">
      <stop offset="0" stop-color="#4F5BFF"/>
      <stop offset="0.55" stop-color="#FF5C8A"/>
      <stop offset="1" stop-color="#FFA24D"/>
    </linearGradient>
    <!-- 白色描边下方的柔和投影,让图形像一张贴纸浮在底板上 -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#B0567A" flood-opacity="0.35"/>
    </filter>
    <!--
      图形路径(整体右移 30,让左右视觉居中):
      - 椅子:M240 360 L310 590 L290 720 = 后仰的椅背 + 微微外张的后腿
              M310 590 H470 L490 720     = 座面 + 微微外张的前腿
      - 小人:M650 720 V440               = 箭杆(身体)
              M575 515 L650 440 L725 515 = 箭头(肩膀)
              M650 318 h0.1              = 脑袋(长度几乎为 0 的线 + 圆头端点 = 一个圆点)
    -->
    <path id="glyph" transform="translate(30 0)"
          d="M240 360 L310 590 L290 720 M310 590 H470 L490 720 M650 720 V440 M575 515 L650 440 L725 515 M650 318 h0.1"/>
  </defs>

  <!-- 1. 圆角方形底板(824×824,四周各留 100 边距,符合 macOS 图标规范) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- 2. 白色贴纸描边(带投影),比主线条宽 42,两侧各露出 21 -->
    <g filter="url(#sh)"><use href="#glyph" stroke="#FFFFFF" stroke-width="118"/></g>
    <!-- 3. 彩色渐变主线条 -->
    <use href="#glyph" stroke="url(#st)" stroke-width="76"/>
  </g>
</svg>
